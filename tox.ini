[tox]
envlist = py,pinned,lint,mypy,twinecheck

[testenv]
deps =
    pytest
    pytest-cov >= 7.0.0
    parsel
commands =
    pytest \
        --cov-report= --cov-report=xml --cov=clear_html \
        --doctest-modules --junitxml=testenv.junit.xml -o junit_family=legacy

[testenv:pinned]
basepython = python3.10
deps =
    {[testenv]deps}
    attrs==23.1.0
    html-text==0.7.0
    parsel==1.10.0

[testenv:lint]
deps = pre-commit
commands = pre-commit run --all-files

[testenv:mypy]
deps =
    mypy==2.3.0
    attrs==26.1.0
    html-text==0.7.1
    parsel==1.11.0
    pytest==9.1.1
    types-lxml==2026.2.16
commands = mypy {posargs:clear_html tests}

[testenv:twinecheck]
basepython = python3
deps =
    twine==7.0.0
    build==1.5.0
commands =
    python -m build --sdist
    twine check dist/*
